<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Map Drawing</title>
    <style>
        /* Map styling */
        #map {
            height: auto;
            width: 100%;
        }
        body, html {
            margin: 0;
            padding: 0;
            background-color: rgb(206, 207, 207);
        }

    </style>
</head>
<body>

<!-- Map Container -->
<div id="map"></div>

<!-- Your script that initializes the map -->
<script>
    function initMap() {
        // Set the initial position of the map
        const map = new google.maps.Map(document.getElementById('map'), {
            center: { lat: 14.5995, lng: 120.9842 }, // Set to Manila, change this if needed
            zoom: 8,
        });

        // Initialize drawing manager for polygon drawing
        const drawingManager = new google.maps.drawing.DrawingManager({
            drawingMode: google.maps.drawing.OverlayType.POLYGON,
            drawingControl: true,
            drawingControlOptions: {
                position: google.maps.ControlPosition.TOP_CENTER,
                drawingModes: ['polygon']
            },
            polygonOptions: {
                editable: true,
                draggable: false,
            }
        });

        // Attach drawing manager to the map
        drawingManager.setMap(map);

        // Event listener for when a polygon is drawn
        google.maps.event.addListener(drawingManager, 'overlaycomplete', function(event) {
            if (event.type === 'polygon') {
                // Get the coordinates of the drawn polygon
                const polygonCoords = event.overlay.getPath().getArray().map(function(latLng) {
                    return { lat: latLng.lat(), lng: latLng.lng() };
                });

                // Output the coordinates to the console (can be sent to a server)
                console.log('Polygon Coordinates:', JSON.stringify(polygonCoords));

                // Optional: You can send the coordinates to your server here via AJAX or fetch
                // Example:
                fetch('crops/save-farm-boundaries', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(polygonCoords),
                }).then(response => response.json()).then(data => {
                    console.log('Success:', data);
                }).catch(error => {
                    console.error('Error:', error);
                });
            }
        });
    }
</script>

<!-- Asynchronously load the Google Maps API -->
<script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBaEr_ZLsaoWcbipd--a1S5EPQe2RaEfio&libraries=drawing&callback=initMap"
    async defer>
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuckDuckGo Query</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }

        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        input[type="text"] {
            width: 300px;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px 20px;
            border: none;
            background-color: #4caf50;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #resultContainer {
            margin-top: 20px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Search DuckDuckGo</h1>
        <input type="text" id="queryInput" placeholder="Enter your query" />
        <button id="searchButton">Search</button>
        <div id="resultContainer"></div>
    </div>
    <script>
        document.getElementById('searchButton').addEventListener('click', function() {
            const query = document.getElementById('queryInput').value;
            fetchDuckDuckGoInstantAnswer(query);
        });

        function fetchDuckDuckGoInstantAnswer(query) {
            const url = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&pretty=1`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.AbstractText) {
                        document.getElementById('resultContainer').innerHTML = `<p>${data.AbstractText}</p>`;
                    } else {
                        document.getElementById('resultContainer').innerHTML = '<p>No information found.</p>';
                    }
                })
                .catch(error => console.error('Error fetching DuckDuckGo data:', error));
        }
    </script>
</body>
</html>

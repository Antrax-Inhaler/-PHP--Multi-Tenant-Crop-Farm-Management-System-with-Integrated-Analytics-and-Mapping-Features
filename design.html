<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        background-color: blue;
    }
    .marker_body{
        background-color: rgb(2, 150, 236);
        width: 50px;
        height: 50px;
        border-radius: 10px;
        padding: 2px;
        border: white  solid thin;
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
    }
    .marker_custom{

        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
    }
    .img_container{
        width: 100%;
        height: 90%;
    }
    .img_container img{
        width: 100%;
        height: 100%;
        border-radius: 9px;

    }
    .product_n p{
        font-size: 10%;
        color: white;
        object-fit:  contain;
    }
    .triangle {
  width: 0;
  height: 0;
  border-left: 18px solid transparent;
  border-right: 18px solid transparent;
  border-top: 10px solid rgb(2, 150, 236); /* Change color as needed */
  z-index: 1;
  
}

</style>
<body>
    <div class="marker_custom">

    <div class="marker_body">
        <div class="img_container">        <img src="./uploads/cover-1644367403.png" alt="">
        </div>
        <div class="product_n">
            <p>Product Name</p>
        </div>

    </div>
    <div class="triangle"></div>

</div>
</body>
</html>

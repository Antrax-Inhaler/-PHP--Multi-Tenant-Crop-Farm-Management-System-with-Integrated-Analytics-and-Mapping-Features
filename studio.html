<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print File without Preview</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .print-area {
            padding: 20px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }
        .btn-print {
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>Print File Demo</h1>
<div class="print-area">
    <h2>Content to Print</h2>
    <p>This is a sample content that will be printed. You can replace this text with the content from your file.</p>
</div>
<button class="btn-print" onclick="printContent()">Print Without Preview</button>

<script>
    function printContent() {
        // JavaScript print functionality
        window.print(); // This will open the print dialog
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Map with Address Selection</title>
    <style>
        /* Set styles for the map and inputs */
        #map {
            height: 400px;
            width: 100%;
        }

        .map-container {
            margin: 20px 0;
        }

        input {
            margin: 10px 0;
            padding: 10px;
            width: 100%;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Google Map with Address Selection</h1>
    <input id="address-input" type="text" placeholder="Enter an address" />
    <div id="map" class="map-container"></div>

    <script>
        let map;
        let marker;

        function initMap() {
            // Initialize the map centered at a default location
            const defaultLocation = { lat: 37.7749, lng: -122.4194 }; // San Francisco, CA

            map = new google.maps.Map(document.getElementById("map"), {
                center: defaultLocation,
                zoom: 13,
            });

            // Add a marker at the default location
            marker = new google.maps.Marker({
                position: defaultLocation,
                map: map,
            });

            // Initialize the Autocomplete feature for address selection
            const input = document.getElementById("address-input");
            const autocomplete = new google.maps.places.Autocomplete(input);

            autocomplete.bindTo("bounds", map);

            // When an address is selected
            autocomplete.addListener("place_changed", () => {
                const place = autocomplete.getPlace();

                if (!place.geometry || !place.geometry.location) {
                    alert("No details available for this address.");
                    return;
                }

                // Move the map to the selected place
                map.setCenter(place.geometry.location);
                map.setZoom(15);

                // Move the marker to the selected place
                marker.setPosition(place.geometry.location);
                marker.setVisible(true);
            });
        }
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAMd33bMoISWyM0YOJ_AG9i7NgIODP2rV4&libraries=places&callback=initMap" async defer></script>
</body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <title>Select Coordinates in Naujan</title>
    <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCPgOaKhjwvksUVP6qBQpjdq3bTQa57NuQ&callback=initMap"
    async
  ></script>  </head>
  <body>
    <div id="map" style="width: 100%; height: 400px;"></div>
    <input id="searchInput" type="text" placeholder="Search Naujan location" style="margin-top: 10px; width: 300px;">
    <script>
      function initMap() {
        const naujanCenter = { lat: 13.3167, lng: 121.3000 };

        const map = new google.maps.Map(document.getElementById("map"), {
          zoom: 14,
          center: naujanCenter,
        });

        let marker;

        function createMarker(latLng) {
          marker = new google.maps.Marker({
            position: latLng,
            map: map,
          });

          const infoWindow = new google.maps.InfoWindow({
            content: `Latitude: ${latLng.lat()}<br>Longitude: ${latLng.lng()}`,
          });

          marker.addListener("click", () => {
            infoWindow.open(map, marker);
          });
        }

        const input = document.getElementById("searchInput");

        const autocomplete = new google.maps.places.Autocomplete(input);
        autocomplete.bindTo("bounds", map);

        autocomplete.setFields(["geometry"]);

        autocomplete.addListener("place_changed", function() {
          const place = autocomplete.getPlace();

          if (!place.geometry) {
            window.alert("No details available for input: '" + place.name + "'");
            return;
          }

          if (place.geometry.viewport) {
            map.fitBounds(place.geometry.viewport);
          } else {
            map.setCenter(place.geometry.location);
            map.setZoom(17);
          }

          if (marker) {
            marker.setMap(null);
          }

          createMarker(place.geometry.location);
        });

        map.addListener("click", (event) => {
          if (marker) {
            marker.setMap(null);
          }
          createMarker(event.latLng);
        });
      }
    </script>
  </body>
</html>
